<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Codex Video Pet</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: "Segoe UI", sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        opacity: var(--overall-opacity, 1);
      }
      #root.panel-above {
        flex-direction: column-reverse;
      }
      #root.video-hidden #stage {
        display: none;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 80px;
        -webkit-app-region: no-drag;
        app-region: no-drag;
        cursor: grab;
      }
      body.dragging,
      body.dragging #stage {
        cursor: grabbing;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        opacity: 0;
        pointer-events: none;
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-mode: alpha;
        mask-position: center;
        mask-repeat: no-repeat;
        mask-mode: alpha;
      }
      video.active {
        opacity: 1;
      }
      #sessions {
        display: none;
        flex: 0 0 auto;
        box-sizing: border-box;
        padding: 8px 10px 10px;
        background: rgba(18, 18, 20, 0.82);
        color: #ececec;
        pointer-events: auto;
        cursor: grab;
      }
      #sessions.visible {
        display: block;
      }
      #sessions h2 {
        margin: 0 0 6px;
        min-height: 18px;
        line-height: 18px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.55);
        cursor: grab;
        -webkit-app-region: drag;
        app-region: drag;
      }
      #session-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 20px;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        touch-action: pan-y;
        user-select: none;
        transition: transform 160ms ease, opacity 160ms ease;
        will-change: transform;
      }
      .session-row.swiping {
        transition: none;
      }
      .session-row.dismissing {
        opacity: 0;
        pointer-events: none;
      }
      .session-row:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .session-row.noninteractive {
        cursor: default;
      }
      .session-row.driving {
        background: rgba(94, 200, 227, 0.18);
      }
      .session-row.pinned {
        outline: 1px solid rgba(94, 200, 227, 0.55);
      }
      .session-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: 0 0 7px;
        background: #6b6b6b;
      }
      .session-dot.running {
        background: #62d07a;
      }
      .session-dot.waiting {
        background: #ffb84d;
        box-shadow: 0 0 6px rgba(255, 184, 77, 0.9);
      }
      .session-dot.completed {
        background: #b884dc;
      }
      .session-agent {
        flex: 0 0 auto;
        max-width: 58px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
        font-weight: 600;
        height: 16px;
        line-height: 16px;
        padding: 0 5px;
        border-radius: 3px;
        color: rgba(255, 255, 255, 0.62);
        background: rgba(255, 255, 255, 0.08);
      }
      .session-agent.codex {
        color: #9fd4ea;
        background: rgba(94, 200, 227, 0.16);
      }
      .session-agent.cursor {
        color: #c4b5fd;
        background: rgba(139, 92, 246, 0.18);
      }
      .session-agent.codely-cli {
        color: #86efac;
        background: rgba(34, 197, 94, 0.16);
      }
      .session-agent.claude-code {
        color: #fdba74;
        background: rgba(234, 88, 12, 0.18);
      }
      .session-title {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-label {
        flex: 0 0 auto;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.45);
      }
      .session-empty {
        height: 20px;
        padding: 0 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="stage">
        <video id="video-a" muted playsinline preload="auto"></video>
        <video id="video-b" muted playsinline preload="auto"></video>
      </div>
      <div id="sessions">
        <h2 id="activity-title">活动</h2>
        <div id="session-list"></div>
      </div>
    </div>
    <script src="./player.js"></script>
  </body>
</html>
